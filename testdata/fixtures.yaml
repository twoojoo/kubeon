apiVersion: v1
kind: Namespace
metadata: {name: demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: demo}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c", "i=0; while true; do echo \"web tick $i $(date)\"; i=$((i+1)); sleep 1; done"]
        - name: sidecar
          image: busybox:1.36
          ports: [{containerPort: 8080}]
          command: ["sh", "-c", "mkdir -p /www && echo k9desk-ok > /www/index.html && httpd -p 8080 -h /www && while true; do echo sidecar alive; sleep 5; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: crasher, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: crasher}}
  template:
    metadata: {labels: {app: crasher}}
    spec:
      containers:
        - name: crasher
          image: busybox:1.36
          command: ["sh", "-c", "echo boom; exit 1"]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: demo}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: settings, namespace: demo}
data: {mode: dev, level: debug}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: ticker, namespace: demo}
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers: [{name: job, image: busybox:1.36, command: ["date"]}]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: widgets.demo.k9desk.io}
spec:
  group: demo.k9desk.io
  scope: Namespaced
  names: {plural: widgets, singular: widget, kind: Widget, shortNames: [wg]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: Secret
metadata: {name: db-creds, namespace: demo}
type: Opaque
stringData:
  username: admin
  password: s3cr3t!
  config.json: '{"host":"db","port":5432}'
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: jsonlog, namespace: demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: jsonlog}}
  template:
    metadata: {labels: {app: jsonlog}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "i=0; while true; do lvl=info; [ $((i%5)) -eq 0 ] && lvl=error; [ $((i%3)) -eq 0 ] && lvl=warn; echo \"{\\\"level\\\":\\\"$lvl\\\",\\\"msg\\\":\\\"request handled\\\",\\\"i\\\":$i,\\\"path\\\":\\\"/api/items\\\",\\\"latency_ms\\\":$((i%97))}\"; i=$((i+1)); sleep 1; done"]
