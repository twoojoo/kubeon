name: Feature request
description: Suggest an idea or a resource view to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work. Mention how other tools (Lens, k9s, Headlamp…) do it if useful.
