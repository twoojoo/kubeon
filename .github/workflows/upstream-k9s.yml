# Daily watch of the upstream k9s project (vendored in third_party/k9s).
#
# watch: rewrites the "k9s upstream watch" issue with the report on moving to
#        k9s master: kubeon's patches dry-run file by file (strict), API
#        changes that touch what kubeon uses, commits and diffstat. The body
#        is edited silently; a comment (= a notification) is added only when
#        the verdict changes (ok ⇄ warn ⇄ fail).
# bump:  when a new k9s release is out (or `ref` is given by hand), re-vendors
#        it, re-applies kubeon's patches, runs the unit and kind integration
#        suites and opens a pull request (draft if anything failed) carrying
#        the report. Falls back to an issue when Actions may not open PRs.
name: k9s upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: k9s tag or branch to try (empty = latest release)
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-k9s
  cancel-in-progress: false

env:
  GIO_LINUX_DEPS: >-
    libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev
    libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev
  WATCH_TITLE: k9s upstream watch

jobs:
  watch:
    runs-on: ubuntu-24.04
    outputs:
      bump: ${{ steps.check.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: report vs k9s master → tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/k9s-upstream-report.sh master > drift.md
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          verdict="$(sed -n 's/^<!-- verdict: \(.*\) -->$/\1/p' drift.md | tail -1)"
          {
            echo "_Updated $(date -u '+%Y-%m-%d %H:%M UTC') by \`.github/workflows/upstream-k9s.yml\`: what moving the vendored k9s to master would take._"
            echo
            head -c 60000 drift.md
            echo
            echo "<!-- verdict: $verdict -->" # again: truncation may have cut it
          } > body.md
          gh label create upstream --color 5319e7 --description "upstream k9s tracking" 2>/dev/null || true
          num="$(gh issue list --label upstream --state open --json number,title \
            --jq "map(select(.title == \"$WATCH_TITLE\")) | .[0].number // empty")"
          if [ -z "$num" ]; then
            gh issue create --title "$WATCH_TITLE" --label upstream --body-file body.md
            exit 0
          fi
          before="$(gh issue view "$num" --json body --jq .body | sed -n 's/^<!-- verdict: \(.*\) -->$/\1/p' | tail -1)"
          gh issue edit "$num" --body-file body.md
          if [ -n "$before" ] && [ "$before" != "$verdict" ]; then
            headline="$(grep -m1 -E '^(✅|⚠️|❌) ' drift.md || true)"
            gh issue comment "$num" --body "Verdict changed: **$before → $verdict**. $headline See the issue body for details."
          fi
      - id: check
        name: new release?
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.ref }}
        run: |
          cur="$(cut -d' ' -f1 third_party/k9s/UPSTREAM)"
          want="${WANT:-$(gh api repos/derailed/k9s/releases/latest -q .tag_name)}"
          if [ "$want" = "$cur" ]; then
            echo "vendored k9s $cur is the latest release"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/branches/upstream/k9s-$want" >/dev/null 2>&1; then
            echo "k9s $want already proposed (branch upstream/k9s-$want; delete it to retry)"
            exit 0
          fi
          prev="$(gh issue list --label upstream --state all --search "\"k9s $want\" in:title" \
            --json title --jq "map(select(.title | startswith(\"k9s $want:\"))) | length")"
          if [ "${prev:-0}" -gt 0 ]; then
            echo "k9s $want already reported in an issue (delete or rename it to retry)"
            exit 0
          fi
          echo "bump=$want" >> "$GITHUB_OUTPUT"

  bump:
    needs: watch
    if: needs.watch.outputs.bump != ''
    runs-on: ubuntu-24.04
    env:
      REF: ${{ needs.watch.outputs.bump }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GIO_LINUX_DEPS xvfb libgl1-mesa-dri
      - name: report
        run: scripts/k9s-upstream-report.sh "$REF" > report.md
      - id: vendor
        name: re-vendor and re-apply kubeon patches
        continue-on-error: true
        run: K9S_REF="$REF" ./scripts/vendor-k9s.sh && go mod tidy
      - id: build
        if: steps.vendor.outcome == 'success'
        continue-on-error: true
        run: go build ./... && go vet -tags dev ./internal/... ./cmd/...
      - id: unit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: make test GIO_TAGS=
      - id: integration
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: make dev-up && xvfb-run -a make test-int GIO_TAGS=
      - name: open pull request
        env:
          VENDOR: ${{ steps.vendor.outcome }}
          BUILD: ${{ steps.build.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { case "$1" in success) echo "✅ passed";; failure) echo "❌ failed";; *) echo "⏭️ skipped";; esac; }
          {
            echo "Automated update of the vendored k9s to **$REF** ([run]($RUN_URL))."
            echo
            echo "| step | result |"
            echo "|---|---|"
            echo "| re-vendor + kubeon patches/overlays | $(icon "$VENDOR") |"
            echo "| build + vet | $(icon "$BUILD") |"
            echo "| unit tests | $(icon "$UNIT") |"
            echo "| kind integration + UI tests | $(icon "$INTEGRATION") |"
            echo
            echo "Before merging: read the commits below, check the UI screenshots artifact, and"
            echo "re-run \`make test-int\` locally if anything looks risky."
            echo
            cat report.md
          } | head -c 65000 > pr.md
          gh label create upstream --color 5319e7 --description "upstream k9s tracking" 2>/dev/null || true
          if [ "$VENDOR" != success ]; then
            # a patch no longer applies: nothing sane to commit, report it
            git checkout -q -- . && git clean -qfd third_party/k9s
            gh issue create --title "k9s $REF: update blocked" --label upstream --body-file pr.md
            exit 0
          fi
          branch="upstream/k9s-$REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -q -m "Bump vendored k9s to $REF" --allow-empty
          git push -q origin "$branch"
          draft=""
          for o in "$VENDOR" "$BUILD" "$UNIT" "$INTEGRATION"; do
            [ "$o" = success ] || draft="--draft"
          done
          if ! gh pr create --base main --head "$branch" --title "Bump vendored k9s to $REF" \
              --label upstream --body-file pr.md $draft; then
            echo "::warning::Actions may not open PRs here: opening an issue instead"
            gh issue create --title "k9s $REF: update ready on branch $branch" --label upstream --body-file pr.md
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k9s-${{ env.REF }}-report
          path: |
            report.md
            .dev/shots/
          if-no-files-found: ignore
